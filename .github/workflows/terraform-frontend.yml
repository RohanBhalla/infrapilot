name: Deploy InfraPilot with Terraform

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the Terraform plan after generating it
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: infrapilot-terraform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, plan, and optionally apply
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo "Missing AWS_DEPLOY_ROLE_ARN repository secret."; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo "Missing TF_STATE_BUCKET repository variable."; exit 1; }
          test -n "$TF_VAR_cognito_domain_prefix" || { echo "Missing COGNITO_DOMAIN_PREFIX repository variable."; exit 1; }
          echo "AWS deployment role secret is configured (value hidden)."
          echo "Terraform state bucket and Cognito domain prefix are configured."
          echo "Workflow ref: ${GITHUB_REF}"

      - name: Log OIDC trust claims (without token)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const parts = token.split('.');
            if (parts.length !== 3) throw new Error('GitHub returned an unexpected OIDC token format.');
            const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
            core.info(`OIDC issuer: ${claims.iss}`);
            core.info(`OIDC audience: ${JSON.stringify(claims.aud)}`);
            core.info(`OIDC subject: ${claims.sub}`);
            core.info(`OIDC repository: ${claims.repository}`);
            core.info(`OIDC ref: ${claims.ref}`);

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check Terraform formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: infra/terraform
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "Set the TF_STATE_BUCKET repository variable."; exit 1; }
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=infrapilot/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        working-directory: infra/terraform
        run: terraform validate

      - name: Create Terraform plan
        working-directory: infra/terraform
        run: terraform plan -input=false -out=tfplan

      - name: Apply Terraform plan
        if: ${{ inputs.apply }}
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve tfplan
