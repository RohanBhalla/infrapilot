[project]
name = "infrapilot-data"
version = "0.1.0"
description = "Document collection and RAG dataset preparation for InfraPilot"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "trafilatura>=1.12",
  "feedparser>=6.0",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
embed = ["boto3>=1.35", "lancedb>=0.13", "pyarrow>=16"]
dev = ["pytest>=8"]

[project.scripts]
infrapilot-data = "infrapilot_data.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infrapilot_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
