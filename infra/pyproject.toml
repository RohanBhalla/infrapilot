[project]
name = "infrapilot-infra"
version = "0.1.0"
description = "AWS CDK app for InfraPilot"
requires-python = ">=3.12"
dependencies = [
  "aws-cdk-lib>=2.170,<3",
  "constructs>=10.0,<11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infrapilot_infra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
