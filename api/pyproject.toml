[project]
name = "infrapilot-api"
version = "0.1.0"
description = "InfraPilot Chat API (FastAPI): sessions and grounded answers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "infrapilot-rag",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
infrapilot-api = "infrapilot_api.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infrapilot_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
